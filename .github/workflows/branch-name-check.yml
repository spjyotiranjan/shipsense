name: Branch and PR key check

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  branch-and-pr-key:
    name: Branch and PR key
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and title
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          const branch = process.env.BRANCH_NAME || '';
          const title = process.env.PR_TITLE || '';
          const keyPattern = /(?:^|[^A-Za-z0-9])(SCRUM-[1-9]\d*)(?![A-Za-z0-9])/;
          const branchKey = keyPattern.exec(branch)?.[1];
          const titleKey = keyPattern.exec(title)?.[1];
          if (!branchKey) {
            console.error('Branch name must include a SCRUM-<issue number> key.');
            process.exit(1);
          }
          if (titleKey !== branchKey) {
            console.error(`PR title must include ${branchKey}.`);
            process.exit(1);
          }
          console.log(`Branch and PR title both use ${branchKey}.`);
          NODE
