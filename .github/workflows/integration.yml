name: Integration

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHIPSENSE_EVIDENCE_DIR: ${{ runner.temp }}/shipsense-evidence
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install pinned package managers
        run: |
          npm install --global npm@11.19.0
          python -m pip install uv==0.12.21
      - name: Frozen bootstrap
        run: npm run bootstrap
      - name: Quality, contracts, units and production builds
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Real seeded API and built-browser smoke
        run: npm run test:smoke
      - name: Reject contract drift and failed upstream, then recover
        run: uv run --frozen --package shipsense-api python scripts/verify-integration-gates.py
      - name: Ownership-checked CI cleanup on every outcome
        if: always()
        run: uv run --frozen --package shipsense-api python scripts/integration-smoke.py --cleanup
      - name: Bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shipsense-evidence/*.json
            ${{ runner.temp }}/shipsense-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false
