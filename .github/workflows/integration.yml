name: Integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  diagnostics:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Initialize external evidence path
        run: echo "SHIPSENSE_EVIDENCE_DIR=$RUNNER_TEMP/shipsense-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install pinned package managers
        run: |
          npm install --global npm@11.19.0
          python -m pip install uv==0.12.21
      - name: Frozen bootstrap
        run: npm run bootstrap
      - name: Quality, contracts, units and production builds
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Credential-free API and built-browser diagnostics
        run: npm run test:smoke
      - name: Reject contract drift and failed API, then recover
        run: uv run --frozen --package shipsense-api python scripts/verify-integration-gates.py
      - name: Bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shipsense-evidence/shipsense-smoke-*/*.json
            ${{ runner.temp }}/shipsense-evidence/shipsense-smoke-*/*.png
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false

  hosted:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Github
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install pinned package managers
        run: |
          npm install --global npm@11.19.0
          python -m pip install uv==0.12.21
      - name: Frozen bootstrap
        run: npm run bootstrap
      - name: Production builds
        run: npm run build
      - name: Read-only hosted MongoDB and private R2 integration
        run: npm run test:integration
        env:
          SHIPSENSE_PROFILE: ${{ vars.SHIPSENSE_PROFILE }}
          SHIPSENSE_MONGODB_URI: ${{ secrets.SHIPSENSE_MONGODB_URI }}
          SHIPSENSE_MONGODB_DATABASE: ${{ secrets.SHIPSENSE_MONGODB_DATABASE }}
          SHIPSENSE_R2_ENDPOINT: ${{ secrets.SHIPSENSE_R2_ENDPOINT }}
          SHIPSENSE_R2_BUCKET: ${{ secrets.SHIPSENSE_R2_BUCKET }}
          SHIPSENSE_R2_ACCESS_KEY_ID: ${{ secrets.SHIPSENSE_R2_ACCESS_KEY_ID }}
          SHIPSENSE_R2_SECRET_ACCESS_KEY: ${{ secrets.SHIPSENSE_R2_SECRET_ACCESS_KEY }}
          SHIPSENSE_EVIDENCE_DIR: ${{ runner.temp }}/shipsense-hosted-evidence
      - name: Bounded sanitized hosted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shipsense-hosted-evidence/shipsense-smoke-*/*.json
            ${{ runner.temp }}/shipsense-hosted-evidence/shipsense-smoke-*/*.png
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false
