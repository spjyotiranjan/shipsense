name: shipsense-local-p01
services:
  mongodb:
    image: docker.io/library/mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    platform: linux/amd64
    entrypoint: ["bash", "/shipsense/mongo-entrypoint.sh"]
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: shipsense_bootstrap
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-root.txt
      MONGO_INITDB_DATABASE: shipsense_fixture_p01
    ports: ["127.0.0.1:37017:27017"]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ${SHIPSENSE_STATE:?external state required}/mongo-root.txt:/run/secrets/mongo-root.txt:ro
      - ${SHIPSENSE_STATE:?external state required}/mongo-app.json:/run/secrets/mongo-app.json:ro
      - ./mongo-init.js:/docker-entrypoint-initdb.d/fixture.js:ro
      - ./mongo-entrypoint.sh:/shipsense/mongo-entrypoint.sh:ro
    tmpfs:
      - /run/shipsense:size=1m,mode=0700
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    labels:
      shipsense.owner: ${SHIPSENSE_OWNER:?owner required}
      shipsense.state: ${SHIPSENSE_STATE_ID:?state identity required}
    networks: [fixture]
  storage:
    image: docker.io/chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    platform: linux/amd64
    entrypoint: ["sh", "/shipsense/storage-entrypoint.sh"]
    environment:
      SHIPSENSE_S3_CONFIG_SHA256: ${SHIPSENSE_S3_CONFIG_SHA256:?validated identity digest required}
    command:
      - mini
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -s3.config=/run/shipsense/s3.json
      - -bucket=shipsense-fixtures
      - -s3.autoCreateBucket=false
      - -s3.iam=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=64
    ports: ["127.0.0.1:38333:8333"]
    volumes:
      - storage-data:/data
      - ${SHIPSENSE_STATE:?external state required}/s3.json:/run/secrets/s3.json:ro
      - ./storage-entrypoint.sh:/shipsense/storage-entrypoint.sh:ro
    tmpfs:
      - /run/shipsense:size=1m,mode=0700
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    labels:
      shipsense.owner: ${SHIPSENSE_OWNER:?owner required}
      shipsense.state: ${SHIPSENSE_STATE_ID:?state identity required}
    networks: [fixture]
networks:
  fixture:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    labels:
      shipsense.owner: ${SHIPSENSE_OWNER:?owner required}
      shipsense.state: ${SHIPSENSE_STATE_ID:?state identity required}
volumes:
  mongo-data:
    labels:
      shipsense.owner: ${SHIPSENSE_OWNER:?owner required}
      shipsense.state: ${SHIPSENSE_STATE_ID:?state identity required}
  mongo-config:
    labels:
      shipsense.owner: ${SHIPSENSE_OWNER:?owner required}
      shipsense.state: ${SHIPSENSE_STATE_ID:?state identity required}
  storage-data:
    labels:
      shipsense.owner: ${SHIPSENSE_OWNER:?owner required}
      shipsense.state: ${SHIPSENSE_STATE_ID:?state identity required}
