[project]
name = "shipsense-workspace"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = []

[tool.uv]
required-version = "==0.12.21"
package = false

[tool.uv.workspace]
members = ["services/api", "services/worker", "packages/local-core"]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["services/api/src", "services/worker/src", "packages/local-core/src", "scripts"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
